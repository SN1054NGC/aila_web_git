# Статическая проверка типов проекта Айлы.
#   .venv_311\Scripts\python.exe -m mypy
[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True
files = aila_core, aila.py, tools

[mypy-tools.*]
# Диагностические скрипты: строгость ниже, они не часть приложения
disallow_untyped_defs = False
